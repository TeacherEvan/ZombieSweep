name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck + build
        run: npm run build

      - name: Test (render3d OFF — default)
        run: npm run test

      # Design P5.1/P5.3: the full suite must also be green with the 3D
      # feature flag ON, exercising the flag-gated bridges end-to-end.
      - name: Test (render3d ON — 3D smoke path)
        run: npm run test:3d

      - name: Security audit
        run: npm audit --audit-level=high
